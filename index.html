<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신혼 전세 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #F7F7F8; --surface: #FFFFFF; --surface-sub: rgba(112,115,124,.08); --surface-faint: rgba(112,115,124,.05);
    --surface-strong: rgba(112,115,124,.16); --surface-brand-subtle: rgba(0,102,255,.05);
    --fg: #171719; --fg-secondary: rgba(46,47,51,.88); --fg-tertiary: rgba(55,56,60,.61); --fg-quaternary: rgba(55,56,60,.28);
    --fg-disable: rgba(55,56,60,.16); --fg-inactive: #989BA2; --fg-inverse: #F7F7F8;
    --brand: #0066FF; --brand-strong: #005EEB; --brand-heavy: #0054D1;
    --positive: #00BF40; --cautionary: #FF9200; --negative: #FF4242;
    --positive-bg: rgba(0,191,64,.08); --cautionary-bg: rgba(255,146,0,.08); --negative-bg: rgba(255,66,66,.08);
    --positive-line: rgba(0,191,64,.43); --cautionary-line: rgba(255,146,0,.43); --negative-line: rgba(255,66,66,.43);
    --line: #E1E2E4; --line-sub: #EAEBEC; --line-faint: #F4F4F5; --line-brand: rgba(0,102,255,.28); --focus-ring: rgba(0,102,255,.12);
    --dimmer: rgba(23,23,25,.52);
    --shadow-xsmall: 0 1px 2px -1px rgba(23,23,25,.10);
    --shadow-small: 0 2px 4px -2px rgba(23,23,25,.06), 0 4px 6px -1px rgba(23,23,25,.06);
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F0F10; --surface: #1B1C1E; --surface-sub: rgba(112,115,124,.22); --surface-faint: rgba(112,115,124,.12);
      --surface-strong: rgba(112,115,124,.28); --surface-brand-subtle: rgba(51,133,255,.05);
      --fg: #F7F7F8; --fg-secondary: rgba(194,196,200,.88); --fg-tertiary: rgba(174,176,182,.61); --fg-quaternary: rgba(174,176,182,.28);
      --fg-disable: rgba(152,155,162,.16); --fg-inactive: #5A5C63; --fg-inverse: #171719;
      --brand: #3385FF; --brand-strong: #1A75FF; --brand-heavy: #0066FF;
      --positive: #1ED45A; --cautionary: #FFA938; --negative: #FF6363;
      --positive-bg: rgba(30,212,90,.08); --cautionary-bg: rgba(255,169,56,.08); --negative-bg: rgba(255,99,99,.08);
      --positive-line: rgba(30,212,90,.43); --cautionary-line: rgba(255,169,56,.43); --negative-line: rgba(255,99,99,.43);
      --line: #37383C; --line-sub: #333438; --line-faint: #2E2F33; --line-brand: rgba(51,133,255,.28); --focus-ring: rgba(51,133,255,.12);
      --dimmer: rgba(23,23,25,.74);
      --shadow-xsmall: none; --shadow-small: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 400 15px/22px var(--font); letter-spacing: .0096em; word-break: keep-all;
         font-variant-numeric: tabular-nums; display: flex; flex-direction: column; }
  button, select, input { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  header { padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -.023em; margin: 0; }
  header .note { color: var(--fg-tertiary); font-size: 12px; line-height: 16px; letter-spacing: .0252em; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr 360px; }
  aside, section.detail { background: var(--surface); overflow-y: auto; padding: 20px 16px; }
  aside { border-right: 1px solid var(--line); }
  section.detail { border-left: 1px solid var(--line); }
  #map { height: 100%; min-height: 300px; }
  h2 { font-size: 13px; line-height: 18px; letter-spacing: .0194em; margin: 24px 0 8px; color: var(--fg-tertiary); font-weight: 600; }
  h2:first-child { margin-top: 0; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg-secondary);
                cursor: pointer; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .0145em; transition: background .14s ease-out, border-color .14s ease-out, color .14s ease-out; }
  .seg button:hover { background: var(--surface-faint); }
  .seg button.on { background: var(--surface-brand-subtle); color: var(--brand); border-color: var(--line-brand); }
  .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; line-height: 20px; color: var(--fg-secondary); }
  .row b { font-size: 15px; line-height: 22px; font-weight: 500; color: var(--fg); }
  input[type=range] { width: 100%; accent-color: var(--brand); margin: 6px 0 0; }
  select { width: 100%; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
           font-size: 14px; font-weight: 500; transition: border-color .14s ease-out, box-shadow .14s ease-out; }
  select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring); }
  .hint { color: var(--fg-tertiary); font-size: 12px; line-height: 16px; letter-spacing: .0252em; margin: 8px 0 0; }
  .warn { background: var(--cautionary-bg); border: 1px solid var(--cautionary-line); border-radius: 8px; padding: 8px 12px; font-size: 12px; line-height: 16px;
          letter-spacing: .0252em; margin-top: 12px; color: var(--fg-secondary); }
  .warn::before { content: "! "; color: var(--cautionary); font-weight: 700; }
  ol#rank { list-style: none; margin: 8px 0 0; padding: 0; }
  ol#rank li { min-height: 40px; padding: 8px 12px; border-bottom: 1px solid var(--line-sub); cursor: pointer; display: flex; justify-content: space-between; align-items: center;
               gap: 8px; border-radius: 8px; transition: background .14s ease-out; }
  ol#rank li:hover { background: var(--surface-faint); }
  ol#rank li.sel { background: var(--surface-brand-subtle); box-shadow: inset 0 0 0 1px var(--line-brand); }
  ol#rank .dot { display: inline-block; width: 8px; height: 8px; border-radius: 9999px; margin-right: 8px; }
  ol#rank small { color: var(--fg-tertiary); font-size: 12px; line-height: 16px; letter-spacing: .0252em; }
  .grade { font-size: 11px; line-height: 14px; font-weight: 500; margin-left: 6px; }
  .grade.good { color: var(--positive); } .grade.mid { color: var(--cautionary); }
  .legend { display: flex; gap: 12px; font-size: 12px; line-height: 16px; letter-spacing: .0252em; color: var(--fg-tertiary); margin-top: 12px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 9999px; margin-right: 4px; }
  .legend i.dash { background: transparent !important; border: 1.5px dashed var(--fg-tertiary); width: 10px; height: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { background: var(--surface-sub); color: var(--fg-secondary); border-radius: 9999px; padding: 2px 10px; font-size: 13px; line-height: 18px; letter-spacing: .0194em; }
  .chip.bad { background: var(--cautionary-bg); color: var(--cautionary); border: 1px solid var(--cautionary-line); padding: 1px 9px; }
  .score { background: var(--surface-sub); border-radius: 12px; padding: 16px; margin: 12px 0; }
  .score .big { font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -.023em; color: var(--brand); }
  .bar { display: grid; grid-template-columns: 56px 1fr 28px; gap: 8px; align-items: center; font-size: 13px; line-height: 18px; margin-top: 8px; }
  .bar span:last-child { text-align: right; font-weight: 500; }
  .bar i { display: block; height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
  .bar i b { position: absolute; inset: 0 auto 0 0; background: var(--brand); }
  .badge { font-size: 11px; line-height: 14px; font-weight: 500; color: var(--cautionary); background: var(--cautionary-bg); border: 1px solid var(--cautionary-line);
           border-radius: 9999px; padding: 0 6px; margin-left: 6px; white-space: nowrap; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .stat { background: var(--surface-sub); border-radius: 8px; padding: 12px; }
  .stat span { display: block; color: var(--fg-tertiary); font-size: 12px; line-height: 16px; letter-spacing: .0252em; }
  .stat b { font-size: 15px; line-height: 22px; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 18px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line-sub); }
  th { color: var(--fg-tertiary); font-weight: 500; font-size: 12px; }
  td.n, th.n { text-align: right; }
  .empty { color: var(--fg-tertiary); padding: 24px 0; text-align: center; }
  .leaflet-tooltip { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
                     font: 500 13px/18px var(--font); box-shadow: var(--shadow-small); }
  .leaflet-tooltip-top:before { border-top-color: var(--surface); }
  .leaflet-tooltip-bottom:before { border-bottom-color: var(--surface); }
  .leaflet-container { font-family: var(--font); }
  .leaflet-bar { box-shadow: var(--shadow-xsmall); border: 1px solid var(--line); border-radius: 8px; }
  .leaflet-bar a { background: var(--surface); color: var(--fg); border-color: var(--line); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 1000px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 360px auto; }
    aside, section.detail { border: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>신혼 전세 지도</h1>
  <span class="note" id="meta"></span>
</header>
<main>
  <aside>
    <h2>계약 유형</h2>
    <div class="seg" id="typeSeg"></div>

    <h2>보증금 상한</h2>
    <div class="row"><span>이하</span><b id="capLabel"></b></div>
    <input type="range" id="cap" min="5000" max="30000" step="1000" value="30000">

    <h2>전용면적 상한</h2>
    <div class="row"><span>이하</span><b id="areaLabel"></b></div>
    <input type="range" id="area" min="20" max="40" step="1" value="40">

    <h2>거래 기간</h2>
    <select id="period">
      <option value="3">최근 3개월</option>
      <option value="6">최근 6개월</option>
      <option value="12" selected>최근 12개월</option>
    </select>

    <div class="warn" id="typeWarn" hidden></div>

    <h2>동네 목록</h2>
    <select id="sort">
      <option value="score">추천 점수 높은 순</option>
      <option value="price">평균 보증금 낮은 순</option>
      <option value="commute">강남역 출퇴근 짧은 순</option>
      <option value="count">거래 많은 순</option>
    </select>
    <div class="legend">
      <span><i style="background:var(--positive)"></i>여유 (상한의 85% 이하)</span>
      <span><i style="background:var(--cautionary)"></i>빠듯 (85~100%)</span>
      <span><i style="background:var(--fg-inactive)"></i>해당 거래 없음</span>
      <span><i class="dash"></i>표본 적음 (3건 미만)</span>
      <span><i style="background:transparent;border:2px solid var(--brand)"></i>선택한 동네</span>
    </div>
    <ol id="rank"></ol>
  </aside>

  <div id="map"></div>

  <section class="detail" id="detail">
    <div class="empty">지도의 동네나 목록을 눌러보세요.</div>
  </section>
</main>

      var dep = a.rows.map(function (r) { return r[5]; });
      a.avg = dep.reduce(function (s, v) { return s + v; }, 0) / n;
      a.min = Math.min.apply(null, dep); a.max = Math.max.apply(null, dep);
      a.rent = a.rows.reduce(function (s, r) { return s + r[6]; }, 0) / n;
    });
    return agg;
  }
  function color(a) {
    if (!a.n) return 'var(--fg-inactive)';
    return a.avg <= state.cap * 0.85 ? 'var(--positive)' : 'var(--cautionary)';
  }
  function grade(a) { return a.avg <= state.cap * 0.85 ? ['good', '여유'] : ['mid', '빠듯']; }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { render(); });
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name.slice(4, -1)).trim(); }

  var agg = [];
  function render() {
    agg = compute();
    var half = state.type === 1;
    Array.prototype.forEach.call($('typeSeg').children, function (b) { b.classList.toggle('on', +b.dataset.i === state.type); });
    $('capLabel').textContent = money(state.cap);
    $('areaLabel').textContent = state.area + '㎡ (' + Math.round(state.area / 3.3058) + '평)';
    var w = $('typeWarn');
    w.hidden = !half;
    if (half) w.textContent = '반전세 데이터는 보증금 1억 원 거래만 들어 있어요. 1억 미만 반전세는 원본 CSV를 받아 다시 가공해야 볼 수 있어요.';

    var total = 0;
    markers.forEach(function (m, i) {
      var a = agg[i]; total += a.n;
      var c = color(a);
      var picked = state.sel === i;
      m.setStyle({
        color: picked ? cssVar('var(--brand)') : cssVar(c), fillColor: cssVar(c),
        weight: picked ? 3 : 2, dashArray: a.n && a.n < 3 && !picked ? '3 3' : null,
        radius: a.n ? 9 + Math.min(10, Math.sqrt(a.n)) : 7, fillOpacity: a.n ? 0.45 : 0.18
      });
      if (picked) m.bringToFront();
      m.unbindTooltip();
      m.bindTooltip(D.dong[i].dong + (a.n ? ' · 평균 ' + money(a.avg) + ' · ' + a.n + '건' : ' · 거래 없음'));
    });

    var order = D.dong.map(function (_, i) { return i; }).filter(function (i) { return agg[i].n; });
    order.sort(function (a, b) {
      if (state.sort === 'count') return agg[b].n - agg[a].n;
      if (state.sort === 'commute') return D.dong[a].commuteMin - D.dong[b].commuteMin;
      if (state.sort === 'score') return (D.dong[b].score || 0) - (D.dong[a].score || 0);
      return agg[a].avg - agg[b].avg;
    });
    var none = D.dong.length - order.length;
    $('rank').innerHTML = order.map(function (i) {
      var d = D.dong[i], a = agg[i];
      var sub = state.sort === 'score' ? (d.score == null ? '-' : d.score + '점')
        : state.sort === 'commute' ? d.commuteMin + '분' : a.n + '건';
      var few = a.n < 3 ? '<span class="badge">표본 적음</span>' : '';
      return '<li data-i="' + i + '" class="' + (state.sel === i ? 'sel' : '') + '"><span><i class="dot" style="background:' + color(a) + '"></i>' +
        esc(d.dong) + ' <small>' + esc(d.gu) + '</small><span class="grade ' + grade(a)[0] + '">' + grade(a)[1] + '</span>' + few + '</span><span>' + money(a.avg) + ' <small>' + sub + '</small></span></li>';
    }).join('') + (none ? '<li style="cursor:default"><small>조건에 맞는 거래가 없는 동네 ' + none + '곳은 숨겼어요.</small></li>' : '');
    Array.prototype.forEach.call($('rank').querySelectorAll('li[data-i]'), function (li) { li.onclick = function () { select(+li.dataset.i, true); }; });
    if (state.sel !== null) showDetail(state.sel);
  }

  function select(i, pan) {
    state.sel = i;
    if (pan) map.panTo([D.dong[i].lat, D.dong[i].lng]);
    render();
  }

  function showDetail(i) {
    var d = D.dong[i], a = agg[i], half = state.type === 1;
    var h = '<h2 style="font-size:20px;line-height:28px;letter-spacing:-.012em;color:var(--fg);margin:0">' + esc(d.dong) + ' <small style="color:var(--fg-tertiary);font-weight:400;font-size:13px">' + esc(d.gu) + '</small></h2>';
    h += '<p style="margin:4px 0">' + esc(d.headline) + '</p>';
    h += '<div class="chips">' + d.strengths.map(function (s) { return '<span class="chip">' + esc(s) + '</span>'; }).join('') +
      d.cautions.map(function (s) { return '<span class="chip bad">' + esc(s) + '</span>'; }).join('') + '</div>';
    if (d.score != null) {
      var bar = function (label, v) { return '<div class="bar"><span>' + label + '</span><i><b style="width:' + v + '%"></b></i><span>' + v + '</span></div>'; };
      h += '<div class="score"><span class="big">' + d.score + '점</span> <small style="color:var(--fg-tertiary);font-size:12px">추천 점수 (출퇴근 40 · 교통 30 · 인프라 30)</small>' +
        bar('출퇴근', d.sCommute) + bar('교통', d.sTransit) + bar('인프라', d.sInfra) + '</div>';
      h += '<p class="hint">강남역까지 약 ' + d.commuteMin + '분 · 환승 ' + d.transfers + '회<br>' + esc(d.route) +
        '<br>※ 노선도 기준 수기 추정치예요. 계약 전에 길찾기 앱으로 꼭 확인하세요.</p>';
    }
    h += '<p class="hint">지하철: ' + esc(d.subway) + '<br>강남역까지 직선 약 ' + d.dist.toFixed(1) + 'km</p>';
    if (!a.n) {
      h += '<div class="empty">이 조건에 맞는 거래가 없어요.</div>';
    } else {
      h += '<div class="stats">' +
        '<div class="stat"><span>평균 보증금</span><b>' + money(a.avg) + '</b></div>' +
        '<div class="stat"><span>거래 건수</span><b>' + a.n + '건</b></div>' +
        '<div class="stat"><span>최저 ~ 최고</span><b>' + money(a.min) + ' ~ ' + money(a.max) + '</b></div>' +
        (half ? '<div class="stat"><span>평균 월세</span><b>' + Math.round(a.rent) + '만</b></div>' : '<div class="stat"><span>표본</span><b>' + (a.n < 5 ? '적음' : '충분') + '</b></div>') +
        '</div>';
      var byC = {};
      a.rows.forEach(function (r) {
        var c = byC[r[1]] = byC[r[1]] || { n: 0, sum: 0, lo: 1e9, hi: 0 };
        c.n++; c.sum += r[5]; c.lo = Math.min(c.lo, r[2]); c.hi = Math.max(c.hi, r[2]);
      });
      var list = Object.keys(byC).map(function (k) { return [k, byC[k]]; }).sort(function (x, y) { return y[1].n - x[1].n; }).slice(0, 8);
      h += '<h2>단지별 (거래 많은 순)</h2><table><tr><th>단지</th><th class="n">면적</th><th class="n">평균</th><th class="n">건</th></tr>' +
        list.map(function (e) {
          var c = e[1], ar = c.lo === c.hi ? c.lo + '㎡' : c.lo + '~' + c.hi + '㎡';
          return '<tr><td>' + esc(e[0]) + '</td><td class="n">' + ar + '</td><td class="n">' + money(c.sum / c.n) + '</td><td class="n">' + c.n + '</td></tr>';
        }).join('') + '</table>';
      var recent = a.rows.slice().sort(function (x, y) { return y[7] - x[7]; }).slice(0, 8);
      h += '<h2>최근 거래</h2><table><tr><th>월</th><th>단지</th><th class="n">층</th><th class="n">보증금' + (half ? '/월세' : '') + '</th></tr>' +
        recent.map(function (r) {
          return '<tr><td>' + D.yms[r[7]].slice(2) + '</td><td>' + esc(r[1]) + '</td><td class="n">' + r[3] + '</td><td class="n">' + money(r[5]) + (half ? '/' + r[6] : '') + '</td></tr>';
        }).join('') + '</table>';
    }
    h += '<p class="hint">실거래가는 이미 체결된 가격이라 지금 나와 있는 매물 가격과 다를 수 있어요.</p>';
    $('detail').innerHTML = h;
  }

  applyTypeDefaults();
  render();
})();
</script>
</body>
</html>
